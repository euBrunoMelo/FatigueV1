# docker-compose.yml — SALTE TEV8 / C37 (Raspberry Pi 5 + IMX500)
#
# Uso:
#   docker compose up              (foreground)
#   docker compose up -d           (detached)
#   docker compose logs -f         (follow logs)
#   docker compose down            (stop)
#
# Default deste compose: picamera2 + libcamera (IMX500 como câmera comum).
# Para HUD OpenCV adicione --display no command (ver bloco no fim do arquivo).
# Para testar com webcam USB, remova --picamera do command.

services:
  salte-tev8:
    build:
      context: .
      dockerfile: Dockerfile
    image: salte-tev8:latest
    container_name: salte-tev8

    # ── Acesso à câmera ────────────────────────────────────────────────
    # IMX500 no Pi 5 cria um pipeline de devices que o libcamera enumera via
    # /run/udev:
    #   /dev/media0..3       — rp1-cfe + codec + pisp_be
    #   /dev/video0..27      — nós de processamento pisp_be
    #   /dev/v4l-subdev0..N  — controle do sensor
    #   /dev/dma_heap/*      — alocadores DMA-BUF (cma, system, vidbuf_cached)
    #   /dev/dri/*           — DRM/KMS render
    #
    # Listar cada dispositivo em `devices:` é frágil (números mudam com kernel
    # e o firmware IMX500 cria 20+ nós de vídeo). Bind-mount de /dev + cgroup
    # para char devices é menos invasivo que `privileged: true`.
    device_cgroup_rules:
      - 'c *:* rmw'        # rw/mknod em todos char devices

    # ── Volumes ─────────────────────────────────────────────────────────
    # /dev      → nós de câmera/codec/dma_heap/dri (pareado com cgroup rule)
    # /run/udev → read-only, libcamera enumera câmeras a partir daí
    # ./logs    → opcional, para logs persistentes fora do container
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ./logs:/app/logs

    # ── Segurança ───────────────────────────────────────────────────────
    # Necessário para ioctls DRM/KMS do libcamera.
    # Se falhar, substitua por: privileged: true
    security_opt:
      - seccomp:unconfined

    # ── Ambiente ────────────────────────────────────────────────────────
    environment:
      - PYTHONUNBUFFERED=1

    # ── Restart ─────────────────────────────────────────────────────────
    restart: unless-stopped

    # ── Comando ─────────────────────────────────────────────────────────
    # --picamera força o uso de picamera2 + libcamera (IMX500). Sem essa
    # flag o run_host.py cai em cv2.VideoCapture(0), que abre /dev/video0
    # sem ISP/AE corretos e perde FPS — fonte conhecida de glitches do
    # FaceMesh durante o warm-up.
    command:
      - "python3"
      - "run_host.py"
      - "--model-dir"
      - "/app"
      - "--picamera"
    # Exemplos de overrides úteis (adicione no command acima):
    #   "--warmup-sec", "60"        warm-up mais curto para testes rápidos
    #   "--threshold", "0.45"       override do limiar do MLP
    #   "--display"                 abre janela OpenCV (HUD) — exige X11 do host
    #
    # Para --display, exponha também o X do host (descomente environment/volumes):
    # environment:
    #   - DISPLAY=${DISPLAY}
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix
