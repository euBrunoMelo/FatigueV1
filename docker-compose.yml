# docker-compose.yml — SALTE TEV8 / C37 (Raspberry Pi 5 + IMX500)
#
# Uso:
#   docker compose up              (foreground)
#   docker compose up -d           (detached)
#   docker compose logs -f         (follow logs)
#   docker compose down            (stop)
#
# Para rodar com --display (HUD OpenCV) ou --no-picamera (webcam USB dev),
# edite o bloco `command:` abaixo.

services:
  salte-tev8:
    build:
      context: .
      dockerfile: Dockerfile
    image: salte-tev8:latest
    container_name: salte-tev8

    # ── Acesso à câmera ────────────────────────────────────────────────
    # IMX500 no Pi 5 cria um pipeline de devices que o libcamera enumera via
    # /run/udev:
    #   /dev/media0..3       — rp1-cfe + codec + pisp_be
    #   /dev/video0..27      — nós de processamento pisp_be
    #   /dev/v4l-subdev0..N  — controle do sensor
    #   /dev/dma_heap/*      — alocadores DMA-BUF (cma, system, vidbuf_cached)
    #   /dev/dri/*           — DRM/KMS render
    #
    # Listar cada dispositivo em `devices:` é frágil (números mudam com kernel
    # e o firmware IMX500 cria 20+ nós de vídeo). Bind-mount de /dev + cgroup
    # para char devices é menos invasivo que `privileged: true`.
    device_cgroup_rules:
      - 'c *:* rmw'        # rw/mknod em todos char devices

    # ── Volumes ─────────────────────────────────────────────────────────
    # /dev      → nós de câmera/codec/dma_heap/dri (pareado com cgroup rule)
    # /run/udev → read-only, libcamera enumera câmeras a partir daí
    # ./logs    → opcional, para logs persistentes fora do container
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ./logs:/app/logs

    # ── Segurança ───────────────────────────────────────────────────────
    # Necessário para ioctls DRM/KMS do libcamera.
    # Se falhar, substitua por: privileged: true
    security_opt:
      - seccomp:unconfined

    # ── Ambiente ────────────────────────────────────────────────────────
    environment:
      - PYTHONUNBUFFERED=1

    # ── Restart ─────────────────────────────────────────────────────────
    restart: unless-stopped

    # ── Override de comando ─────────────────────────────────────────────
    # Default do Dockerfile: python3 run_host.py --model-dir /app
    #
    # Exemplos:
    #   command: ["python3", "run_host.py", "--model-dir", "/app", "--warmup-sec", "60"]
    #   command: ["python3", "run_host.py", "--model-dir", "/app", "--threshold", "0.45"]
    #
    # Para --display é preciso também expor o X do host (descomente environment/volumes):
    # environment:
    #   - DISPLAY=${DISPLAY}
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix
    # command: ["python3", "run_host.py", "--model-dir", "/app", "--display"]
